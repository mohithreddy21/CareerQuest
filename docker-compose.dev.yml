services:
  postgres:
    image: postgres:15-alpine
    container_name: careerquest-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mohithreddy
      POSTGRES_DB: careerquest_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careerquest_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
