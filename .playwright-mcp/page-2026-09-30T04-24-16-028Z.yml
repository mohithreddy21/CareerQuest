                          - generic [ref=f13e296]:
                            - generic [ref=f13e297]: Q1.
                            - generic [ref=f13e298]: Why are you interested in joining Linear as a Staff Software Engineer, Developer Experience?
                          - generic [ref=f13e299]: motivation
                        - generic [ref=f13e300]: I have long followed Linear's engineering culture and focus on high-reliability systems. Throughout my career at Veloce Labs and Apex Cloud Systems, I have focused on building scalable, latency-sensitive web architectures and developer experiences. The technical roadmap for Linear directly aligns with my passion for distributed cloud services and engineering craftsmanship.
                      - generic [ref=f13e301]:
                        - generic [ref=f13e302]:
                          - generic [ref=f13e303]:
                            - generic [ref=f13e304]: Q2.
                            - generic [ref=f13e305]: Describe a recent technical challenge you solved and how you measured success.
                          - generic [ref=f13e306]: behavioral
                        - generic [ref=f13e307]: At Veloce Labs, our core dashboard experienced p95 latency spikes up to 2.4s under peak concurrency. I spearheaded an architectural overhaul incorporating SSR streaming, query cache normalization, and tiered Redis caching. This dropped p95 latency by over 80% down to 420ms and cut Redis CPU utilization by 45%, directly improving retention across 120,000 active users.
                      - generic [ref=f13e308]:
                        - generic [ref=f13e309]:
                          - generic [ref=f13e310]:
                            - generic [ref=f13e311]: Q3.
                            - generic [ref=f13e312]: Tell us about an open-source tool, system, or project you built from scratch.
                          - generic [ref=f13e313]: technical
                        - generic [ref=f13e314]: I designed and open-sourced OpenMetric Dashboard, a real-time observability visualizer built with TypeScript, Next.js, and WebSocket streaming. It earned over 1,800 GitHub stars and is adopted by more than 300 engineering teams globally for lightweight metrics visualization.
                      - generic [ref=f13e315]:
                        - generic [ref=f13e316]:
                          - generic [ref=f13e317]:
                            - generic [ref=f13e318]: Q4.
                            - generic [ref=f13e319]: How do you collaborate across disciplines (product, design, infra) to maintain delivery velocity?
                          - generic [ref=f13e320]: behavioral
                        - generic [ref=f13e321]: I treat engineering velocity and product alignment as shared responsibilities. At Veloce Labs, I led full-stack squads in close sync with product managers and UX designers, establishing clear API contracts early and implementing optimistic UI patterns so features felt instantaneous to users while backend pipelines scaled safely.
