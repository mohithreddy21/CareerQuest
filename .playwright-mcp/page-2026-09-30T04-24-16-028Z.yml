                      - generic [ref=f13e280]: Read-Only
                    - generic [ref=f13e282]: Dear Linear Hiring Team, I am writing to submit my application for the Staff Software Engineer, Developer Experience position at Linear. With a commitment to high standards and structured engineering practices, I have followed Linear's technical trajectory and developer-first products with admiration. I am eager to contribute my background and disciplined engineering approach to the initiatives and team objectives at Linear. My core strengths in TypeScript, React, Real-time Sync align closely with the engineering initiatives outlined for Linear. I am passionate about engineering craftsmanship, deep observability, and fostering collaborative teams that deliver resilient software. Thank you for your time and consideration. I welcome the opportunity to discuss how my verified background and technical capabilities can support Linear's engineering goals. Sincerely, mohith reddy
